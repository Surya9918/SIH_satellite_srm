name: Bug Report
description: Report a bug in satellite-srm
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting an issue! Please provide as much detail as possible."
  - type: textarea
    attributes:
      label: Description
      description: Describe the issue clearly
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this issue?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs/Stack Trace
      description: Paste any relevant logs or error messages here.
