name: Lint Code Base

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install flake8
      run: pip install flake8
    - name: Lint with flake8
      run: |
        cd backend-main/Satellite_SRM_DL
        flake8 server.py --count --select=E9,F63,F7,F82 --show-source --statistics || true

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '18'
    - name: Install dependencies
      run: |
        cd satellite-srm-frontend
        npm ci
    - name: Run ESLint
      run: |
        cd satellite-srm-frontend
        npm run lint || true
