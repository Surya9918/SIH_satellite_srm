version: '3.9'

services:
  backend:
    build: 
      context: ./Satellite_SRM_DL
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./Satellite_SRM_DL/data:/app/data
      - ./Satellite_SRM_DL/outputs:/app/outputs
    restart: unless-stopped

  frontend:
    build: 
      context: ./satellite-srm-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    restart: unless-stopped
